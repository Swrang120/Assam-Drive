<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087a52"><title>Create Account • Assam Drive</title><link rel="icon" href="../assets/assam-drive-logo.jpg"><style>body{margin:0;background:#07120e;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;font:15px system-ui;color:#17211d}.box{width:min(460px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0008}.logo{display:block;width:78px;height:78px;object-fit:contain;margin:auto;border-radius:20px}.brand{text-align:center;color:#087a52;font-size:26px;font-weight:900;margin-top:8px}.sub{text-align:center;color:#66736d;margin:4px 0 20px}.grid{display:grid;gap:10px}.grid input{padding:13px;border:1px solid #dce6e1;border-radius:12px;font:inherit}.btn{min-height:54px;border:0;border-radius:13px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#087a52;color:#fff}.ghost{background:#f4f7f5;color:#087a52}.status{min-height:22px;color:#b3261e;font-size:13px}.hidden{display:none}.back{text-align:center;margin-top:14px}.back a{color:#087a52;text-decoration:none;font-weight:800}</style></head><body><main class="box"><img class="logo" src="../assets/assam-drive-logo.jpg"><div class="brand">Create Account</div><div class="sub">Verify your Gmail, then create your password.</div><div id="roleStep"><div class="grid"><button class="btn primary" data-role="CUSTOMER">👤 Create Customer Account</button><button class="btn ghost" data-role="DRIVER">🚗 Create Driver Account</button></div></div><div id="form" class="hidden"><div class="grid"><input id="name" placeholder="Full name" autocomplete="name"><input id="phone" inputmode="tel" placeholder="10-digit mobile number" autocomplete="tel"><input id="email" type="email" placeholder="Gmail / Email" autocomplete="email"><button class="btn primary" id="send">📩 Send Gmail OTP</button><div id="otpBox" class="hidde
