<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087a52">
<title>Create Account • Assam Drive</title>
<link rel="icon" href="../assets/assam-drive-logo.jpg">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#07120e;color:#17211d;min-height:100vh;padding:20px;display:grid;place-items:center}
.box{width:min(460px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0008;position:relative;z-index:1;pointer-events:auto}
.logo{display:block;width:78px;height:78px;object-fit:contain;margin:auto;border-radius:20px}
.brand{text-align:center;color:#087a52;font-size:26px;font-weight:900;margin-top:8px}
.sub{text-align:center;color:#66736d;margin:4px 0 20px}
.grid{display:grid;gap:10px}
.btn,.grid input{width:100%;min-height:54px;border-radius:13px;font:inherit}
.btn{border:0;font-weight:800;font-size:15px;cursor:pointer;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative;z-index:2}
.grid input{padding:13px;border:1px solid #dce6e1;background:#fff;color:#17211d;outline:none;position:relative;z-index:2;pointer-events:auto;touch-action:manipulation}
.grid input:focus{border-color:#087a52;box-shadow:0 0 0 3px #087a5220}
.primary{background:#087a52;color:#fff}
.ghost{background:#f4f7f5;color:#087a52;border:1px solid #dce6e1}
.role-choice{display:grid;gap:10px}
.role-choice .btn{min-height:62px}
.role-choice .selected{box-shadow:0 0 0 3px #087a5240}
.status{min-height:22px;color:#b3261e;font-size:13px;margin-top:4px}
.hidden{display:none!important}
.back{text-align:center;margin-top:14px}
.back a{color:#087a52;text-decoration:none;font-weight:800;position:relative;z-index:3;pointer-events:auto;touch-action:manipulation}
.btn:disabled{opacity:.65;cursor:wait}
.note{font-size:12px;color:#66736d;text-align:center;margin-top:10px}
</style>
</head>
<body>
<main class="box">
<img class="logo" src="../assets/assam-drive-logo.jpg" alt="Assam Drive">
<div class="brand">Create Account</div>
<div class="sub">Choose your account type first.</div>

<section id="roleStep">
<div class="role-choice">
<button type="button" class="btn primary" data-role="CUSTOMER">👤 Create Customer Account</button>
<button type="button" class="btn ghost" data-role="DRIVER">🚗 Create Driver Account</button>
</div>
<div class="note">You can change the account type before sending OTP.</div>
</section>

<section id="form" class="hidden">
<div id="selectedRole" class="note" style="margin:0 0 12px"></div>
<div class="grid">
<input id="name" type="text" placeholder="Full name" autocomplete="name">
<input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel">
<input id="email" type="email" placeholder="Gmail / Email" autocomplete="email">

<button type="button" class="btn primary" id="send">📩 Send Gmail OTP</button>

<div id="otpBox" class="hidden">
<input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit Gmail OTP" autocomplete="one-time-code">
<button type="button" class="btn primary" id="verify" style="margin-top:10px">Verify Gmail</button>
</div>

<div id="passBox" class="hidden">
<input id="pass" type="password" placeholder="Create password" autocomplete="new-password">
<input id="confirm" type="password" placeholder="Confirm password" autocomplete="new-password">
<button type="button" class="btn primary" id="complete">Complete Account</button>
</div>

<button type="button" class="btn ghost" id="change">← Change account type</button>
</div>
<div class="status" id="status" aria-live="polite"></div>
</section>

<div class="back"><a href="../index.html">← Back</a> · <a href="./login.html">Login</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./signup.js"></script>
</body>
</html>
