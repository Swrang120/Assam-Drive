<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087a52">
<title>Create Account • Assam Drive</title>
<link rel="icon" href="../assets/assam-drive-logo.jpg">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#07120e;min-height:100vh;padding:20px;display:grid;place-items:center}
.box{width:min(460px,100%);background:#fff;color:#17211d;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0008}
.logo{display:block;width:78px;height:78px;object-fit:contain;margin:auto;border-radius:20px}
.brand{text-align:center;color:#087a52;font-size:26px;font-weight:900;margin-top:8px}
.sub{text-align:center;color:#66736d;margin:4px 0 20px}
.role-links{display:grid;gap:12px}
.role-link{display:flex;align-items:center;justify-content:center;min-height:64px;width:100%;border-radius:14px;text-decoration:none;font-weight:900;font-size:16px;position:relative;z-index:10;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.customer{background:#087a52;color:#fff}
.driver{background:#edf4ff;color:#24588f;border:2px solid #6e9edc}
.back{text-align:center;margin-top:16px}
.back a{color:#087a52;text-decoration:none;font-weight:800;position:relative;z-index:10;pointer-events:auto}
.note{text-align:center;color:#66736d;font-size:12px;margin-top:12px}
</style>
</head>
<body>
<main class="box">
<img class="logo" src="../assets/assam-drive-logo.jpg" alt="Assam Drive">
<div class="brand">Create Account</div>
<div class="sub">Choose your account type</div>

<div class="role-links">
<a class="role-link customer" href="./signup.html?role=CUSTOMER">👤 Create Customer Account</a>
<a class="role-link driver" href="./signup.html?role=DRIVER">🚗 Create Driver Account</a>
</div>

<div class="note">Customer and Driver accounts have different registration requirements.</div>
<div class="back"><a href="../index.html">← Back</a> · <a href="./login.html">Login</a></div>
</main>
</body>
</html>
